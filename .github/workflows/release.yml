name: Release (Windows x64)

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-windows-x64:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Setup Rust (MSVC)
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable-x86_64-pc-windows-msvc

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target"

      - name: Install frontend dependencies
        shell: pwsh
        run: pnpm --dir web install --frozen-lockfile

      - name: Build embedded frontend
        shell: pwsh
        run: pnpm --dir web build

      - name: Run Rust tests
        shell: pwsh
        run: cargo test --locked

      - name: Build release binary
        shell: pwsh
        run: cargo build --release --locked --bin mitmrs

      - name: Package release archive
        id: package
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $tag = "${{ github.ref_name }}"
          $name = "MitmRs-$tag-windows-x64"
          $stage = Join-Path "release" $name
          New-Item -ItemType Directory -Force -Path $stage | Out-Null

          Copy-Item "target/release/mitmrs.exe" (Join-Path $stage "mitmrs.exe")
          Copy-Item "third_part/WinDivert-2.2.2-A/x64/WinDivert.dll" (Join-Path $stage "WinDivert.dll")
          Copy-Item "third_part/WinDivert-2.2.2-A/x64/WinDivert64.sys" (Join-Path $stage "WinDivert64.sys")
          Copy-Item "third_part/WinDivert-2.2.2-A/LICENSE" (Join-Path $stage "WinDivert-LICENSE.txt")
          Copy-Item "README.md" (Join-Path $stage "README.md")
          Copy-Item "LICENSE" (Join-Path $stage "LICENSE")
          Copy-Item "NOTICE.md" (Join-Path $stage "NOTICE.md")

          $zip = Join-Path "release" "$name.zip"
          Compress-Archive -Path (Join-Path $stage "*") -DestinationPath $zip -CompressionLevel Optimal

          $hash = (Get-FileHash -Algorithm SHA256 $zip).Hash.ToLowerInvariant()
          $shaFile = "$zip.sha256"
          "$hash  $name.zip" | Set-Content -Encoding ascii $shaFile

          "zip=$zip" >> $env:GITHUB_OUTPUT
          "sha=$shaFile" >> $env:GITHUB_OUTPUT
          "name=$name" >> $env:GITHUB_OUTPUT
          Get-ChildItem "release" | Select-Object Name, Length

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.name }}
          path: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.sha }}
          if-no-files-found: error
          retention-days: 14

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: MitmRs ${{ github.ref_name }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}
          generate_release_notes: true
          body: |
            Windows x64 build of MitmRs ${{ github.ref_name }}.

            The archive contains `mitmrs.exe`, the embedded web UI, and the
            WinDivert 2.2.2 runtime files (`WinDivert.dll`, `WinDivert64.sys`).
            Extract the whole archive to one directory and run `mitmrs.exe`.

            HTTPS capture requires trusting the generated CA. Open the web UI
            and use the CA dialog, or run (elevated):

            ```powershell
            certutil -addstore -f Root "$env:LOCALAPPDATA\MitmRs\ca\ca.crt"
            ```

            WinDivert transparent mode requires Administrator privileges.
          files: |
            ${{ steps.package.outputs.zip }}
            ${{ steps.package.outputs.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
