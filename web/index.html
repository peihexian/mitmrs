<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#080c12" />
    <meta name="color-scheme" content="dark light" />
    <meta
      name="description"
      content="MitmRs — an AI-native MITM traffic lab for inspecting, decoding, and automating HTTP traffic."
    />
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23080c12'/%3E%3Cpath d='M5 20.5h4.5l3-9 4 13 3-9 2.5 5H27' fill='none' stroke='%2322d3ee' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <title>MitmRs — AI-native MITM traffic lab</title>
    <script>
      // Apply the saved (or system) theme before the first paint so the shell
      // never flashes the wrong palette. useTheme() re-applies the same state.
      (function () {
        var theme = 'dark'
        try {
          var stored = window.localStorage.getItem('mitmrs.theme')
          if (stored === 'light' || stored === 'dark') {
            theme = stored
          } else if (
            window.matchMedia &&
            window.matchMedia('(prefers-color-scheme: light)').matches
          ) {
            theme = 'light'
          }
        } catch (error) {
          /* localStorage may be unavailable; keep the default theme. */
        }
        var root = document.documentElement
        root.classList.add(theme === 'light' ? 'theme-light' : 'theme-dark')
        root.style.colorScheme = theme
        var scheme = document.querySelector('meta[name="color-scheme"]')
        if (scheme) scheme.setAttribute('content', theme)
        var color = document.querySelector('meta[name="theme-color"]')
        if (color) color.setAttribute('content', theme === 'light' ? '#f1f5f9' : '#080c12')
      })()
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
